<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PH Weather Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      color: #fff;
      background: linear-gradient(135deg, #1e3c72, #2a5298, #6a3093);
      padding: 2rem 1rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Colorful blurred blobs behind the glass */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      z-index: -1;
      animation: float 12s ease-in-out infinite;
    }
    .blob.one   { width: 350px; height: 350px; background: #ff6ec4; top: -80px; left: -80px; }
    .blob.two   { width: 300px; height: 300px; background: #00d2ff; bottom: -60px; right: -60px; animation-delay: -4s; }
    .blob.three { width: 250px; height: 250px; background: #f9d423; top: 40%; left: 50%; animation-delay: -8s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(30px, -30px); }
    }

    .container { max-width: 900px; margin: 0 auto; }

    /* The glass effect */
    .glass {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; }

    select {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      outline: none;
    }
    select option { background: #2a5298; }

    /* Hidden until we hook up PAGASA alerts */
    .alert {
      display: none;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      background: rgba(255, 60, 60, 0.25);
      border-color: rgba(255, 120, 120, 0.5);
    }

    .current {
      padding: 2rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .current .icon { font-size: 5rem; }
    .current .temp { font-size: 4rem; font-weight: 300; }
    .current .desc { font-size: 1.2rem; opacity: 0.9; }

    .stats { display: grid; grid-template-columns: repeat(2, auto); gap: 0.8rem 2rem; }
    .stats div span { display: block; font-size: 0.8rem; opacity: 0.7; }
    .stats div strong { font-size: 1.1rem; }

    .forecast {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 1rem;
    }
    .day {
      padding: 1.2rem 0.8rem;
      text-align: center;
      transition: transform 0.2s;
    }
    .day:hover { transform: translateY(-5px); }
    .day .name { font-weight: 600; margin-bottom: 0.5rem; }
    .day .icon { font-size: 2.2rem; margin: 0.5rem 0; }
    .day .range { font-size: 0.95rem; }
    .day .rain { font-size: 0.8rem; opacity: 0.8; margin-top: 0.3rem; }

    .updated { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; opacity: 0.7; }

header { position: relative; z-index: 10; } /* keeps the dropdown above the cards */

.search { position: relative; }

.search input {
  width: 260px;
  max-width: 100%;
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 12px;
  padding: 0.6rem 1rem;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}
.search input::placeholder { color: rgba(255, 255, 255, 0.6); }
.search input:focus {
  border-color: rgba(255, 255, 255, 0.6);
  background: rgba(255, 255, 255, 0.22);
}

.suggestions {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  list-style: none;
  padding: 0.4rem;
  border-radius: 14px;
  background: rgba(30, 50, 110, 0.85); /* more opaque so text stays readable */
}
.suggestions.show { display: block; }

.suggestions li {
  padding: 0.6rem 0.8rem;
  border-radius: 10px;
  cursor: pointer;
}
.suggestions li:hover,
.suggestions li.active { background: rgba(255, 255, 255, 0.2); }
.suggestions li small { display: block; font-size: 0.75rem; opacity: 0.7; }
.suggestions li.empty { cursor: default; opacity: 0.7; }


.alert strong { display: block; font-size: 1.15rem; margin-bottom: 0.3rem; }
.alert p { opacity: 0.9; margin-bottom: 0.5rem; }
.alert a { color: #fff; font-weight: 600; }
.alert .tag { font-size: 0.75rem; opacity: 0.7; }

  </style>
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <div class="container">
    <header class="glass">
  <h1>🇵🇭 PH Weather Dashboard</h1>
  <div class="search">
    <input type="text" id="search" placeholder="Search a city or town..." autocomplete="off" />
    <ul id="suggestions" class="suggestions glass"></ul>
  </div>
</header>

    <div id="alert" class="glass alert"></div>

    <section class="glass current" id="current">Loading...</section>

    <section class="forecast" id="forecast"></section>

    <p class="updated" id="updated"></p>
  </div>

  <script>
  // Load the last place the user picked, or default to Manila
  let place = JSON.parse(localStorage.getItem("place")) ||
    { name: "Manila", region: "Metro Manila", lat: 14.5995, lon: 120.9842 };

  function describe(code) {
    if (code === 0) return ["Clear sky", "☀️"];
    if (code <= 3) return ["Partly cloudy", "⛅"];
    if (code <= 48) return ["Foggy", "🌫️"];
    if (code <= 57) return ["Drizzle", "🌦️"];
    if (code <= 67) return ["Rain", "🌧️"];
    if (code <= 77) return ["Snow", "❄️"];
    if (code <= 82) return ["Rain showers", "🌦️"];
    return ["Thunderstorm", "⛈️"];
  }

  async function loadWeather() {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}` +
      `&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,precipitation,weather_code` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
      `&timezone=Asia/Manila`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error("Network error");
      const data = await res.json();
      const c = data.current;
      const [desc, icon] = describe(c.weather_code);

      document.getElementById("current").innerHTML = `
        <div>
          <div class="desc">${place.name}${place.region ? ", " + place.region : ""}</div>
          <div class="temp">${Math.round(c.temperature_2m)}°C</div>
          <div class="desc">${desc}</div>
        </div>
        <div class="icon">${icon}</div>
        <div class="stats">
          <div><span>Feels like</span><strong>${Math.round(c.apparent_temperature)}°C</strong></div>
          <div><span>Humidity</span><strong>${c.relative_humidity_2m}%</strong></div>
          <div><span>Wind</span><strong>${c.wind_speed_10m} km/h</strong></div>
          <div><span>Rain</span><strong>${c.precipitation} mm</strong></div>
        </div>`;

      const d = data.daily;
      document.getElementById("forecast").innerHTML = d.time.map((day, i) => {
        const [, dayIcon] = describe(d.weather_code[i]);
        const name = i === 0 ? "Today"
          : new Date(day).toLocaleDateString("en-PH", { weekday: "short" });
        return `
          <div class="glass day">
            <div class="name">${name}</div>
            <div class="icon">${dayIcon}</div>
            <div class="range">${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°</div>
            <div class="rain">💧 ${d.precipitation_probability_max[i]}%</div>
          </div>`;
      }).join("");

      document.getElementById("updated").textContent =
        `Last updated: ${new Date().toLocaleTimeString("en-PH")}`;
    } catch (err) {
      document.getElementById("current").textContent =
        "Couldn't load weather data. Check your connection and try again.";
    }
  }

  // ---------- City search ----------
  const input = document.getElementById("search");
  const list = document.getElementById("suggestions");
  let results = [];
  let activeIndex = -1;
  let debounceTimer;

  input.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    const query = input.value.trim();
    if (query.length < 2) return hideSuggestions();
    // Wait until the user stops typing for 300ms before searching
    debounceTimer = setTimeout(() => searchPlaces(query), 300);
  });

  async function searchPlaces(query) {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}` +
      `&count=6&language=en&countryCode=PH`;
    try {
      const res = await fetch(url);
      const data = await res.json();
      results = data.results || [];
      renderSuggestions();
    } catch {
      results = [];
      renderSuggestions("Search failed. Try again.");
    }
  }

  function renderSuggestions(message) {
    list.innerHTML = "";
    activeIndex = -1;

    if (results.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = message || "No places found";
      list.appendChild(li);
    } else {
      results.forEach((r, i) => {
        // Build elements with textContent (safer than inserting API text as HTML)
        const li = document.createElement("li");
        li.textContent = r.name;
        const small = document.createElement("small");
        small.textContent = [r.admin2, r.admin1].filter(Boolean).join(", ");
        li.appendChild(small);
        li.addEventListener("click", () => selectPlace(i));
        list.appendChild(li);
      });
    }
    list.classList.add("show");
  }

  function selectPlace(i) {
    const r = results[i];
    place = { name: r.name, region: r.admin1 || "", lat: r.latitude, lon: r.longitude };
    localStorage.setItem("place", JSON.stringify(place));
    input.value = "";
    hideSuggestions();
    loadWeather();
  }

  function hideSuggestions() {
    list.classList.remove("show");
    results = [];
    activeIndex = -1;
  }

  // Keyboard support: arrow keys to move, Enter to pick, Escape to close
  input.addEventListener("keydown", (e) => {
    const items = list.querySelectorAll("li:not(.empty)");
    if (!items.length) return;

    if (e.key === "ArrowDown") {
      e.preventDefault();
      activeIndex = (activeIndex + 1) % items.length;
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      activeIndex = (activeIndex - 1 + items.length) % items.length;
    } else if (e.key === "Enter") {
      selectPlace(activeIndex >= 0 ? activeIndex : 0);
      return;
    } else if (e.key === "Escape") {
      hideSuggestions();
      return;
    }
    items.forEach((li, i) => li.classList.toggle("active", i === activeIndex));
  });

  // Close the dropdown when clicking anywhere else
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".search")) hideSuggestions();
  });

async function loadAlerts() {
  const box = document.getElementById("alert");
  try {
    // Visit localhost:3000/?test to preview the alert card with sample data
    const test = new URLSearchParams(location.search).has("test") ? "?test=1" : "";
    const res = await fetch("/api/alerts" + test);
    const a = await res.json();

    if (!a.active) {
      box.style.display = "none";
      return;
    }

    box.innerHTML = "";

    const title = document.createElement("strong");
    const stormName = a.category && a.name ? `${a.category} ${a.name}` : "Tropical cyclone";
    title.textContent = `🌀 ${stormName}${a.bulletinNumber ? ` · Bulletin #${a.bulletinNumber}` : ""}`;

    const info = document.createElement("p");
    info.textContent = a.issuedAt
      ? `Issued at ${a.issuedAt}. Stay updated and follow your LGU's advisories.`
      : "A PAGASA tropical cyclone bulletin is in effect.";

    const link = document.createElement("a");
    link.href = a.pdfUrl || a.sourceUrl;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = a.pdfUrl ? "Read the full PAGASA bulletin (PDF) →" : "View on PAGASA's website →";

    box.append(title, info, link);

    if (a.test || a.stale) {
      const tag = document.createElement("p");
      tag.className = "tag";
      tag.textContent = a.test ? "Test mode: sample data" : "PAGASA unreachable, showing last known bulletin";
      box.appendChild(tag);
    }

    box.style.display = "block";
  } catch {
    box.style.display = "none";
  }
}

loadAlerts();
setInterval(loadAlerts, 30 * 60 * 1000);


  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
</script>
</body>
</html>
